let currentWeek=0,view='week';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDay(date,offset){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+offset);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function linkHTML(k){let r=SITES[k],url=r&&r.url,label=r&&r.label;if(CONFIG.githubFiles[k]){url=CONFIG.githubFiles[k];label='My '+k.replace(/-/g,' ')+' file';}if(!url)return '';try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return '';}catch(e){return '';}return `<a class="resource" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(label)} in a new tab">↗ ${esc(label)}</a>`;}
// Add focused learning links based on the actual mission, not a generic subject homepage.
// Search links are labelled as searches; we do not pretend they are exact worksheets or quizzes.
function topicForSlot(s){
 const t=(s.title+' '+s.task).toLowerCase();
 const rules=[
  [/osmosis|diffusion|transport|organelles|cells/, 'biology cells diffusion osmosis'],
  [/enzymes|respiration|photosynthesis/, 'biology enzymes respiration photosynthesis'],
  [/genetics|inheritance/, 'biology genetics inheritance'],
  [/atomic|isotopes|electron/, 'chemistry atomic structure isotopes electron configuration'],
  [/chemistry|bonding|mixtures/, 'chemistry bonding mixtures'],
  [/forces|energy|physics/, 'physics forces energy calculations'],
  [/trig|similarity/, 'maths trigonometry similarity'],
  [/sequences|nth.term|patterns|investigation/, 'maths linear sequences nth term'],
  [/algebra|linear functions|modelling/, 'maths algebra linear graphs'],
  [/probability/, 'maths probability'],
  [/english|extract|language analysis/, 'English language analysing writers methods comparing texts'],
  [/geography|map|graph|data evaluation/, 'geography map skills data interpretation'],
  [/humanities|history|source|opvl/, 'history source evaluation origin purpose value limitation'],
  [/economics|stakeholder/, 'economics stakeholders supply demand'],
  [/spanish/, 'Spanish GCSE speaking identity culture'],
  [/french/, 'French GCSE speaking school hobbies future plans']
 ];
 const rule=rules.find(r=>r[0].test(t));return rule?rule[1]:'';
}
function searchLink(site,topic,label){
 const q='site:'+site+' '+topic;
 const url='https://www.google.com/search?q='+encodeURIComponent(q);
 return `<a class="resource" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)} for ${esc(topic)} (search results)">⌕ ${esc(label)}</a>`;
}
function extraLinks(s){
 if(!['revision','quiz'].includes(s.category))return '';
 const t=(s.title+' '+s.task).toLowerCase(),topic=topicForSlot(s);
 if(!topic)return '';
 const curated=[];
 if(/osmosis|diffusion|cells/.test(t))curated.push('osmosis-bbc','transport-bbc');
 if(/atomic|isotopes|electron/.test(t))curated.push('chem-bbc','chem-terms-bbc');
 if(/science|biology|chemistry|physics/.test(t))curated.push('cognito');
 if(/maths|sequences|trig|algebra|pattern/.test(t))curated.push('schoolmaths');
 if(/spanish|french/.test(t))curated.push('languages-online');
 const keys=[...new Set(curated)].filter(k=>!s.links.includes(k));
 const specific=keys.map(linkHTML).join('');
 const bbc=searchLink('bbc.co.uk/bitesize',topic,'Find BBC topic');
 const quiz=s.category==='quiz'?searchLink('wordwall.net',topic,'Find topic game'):searchLink('quizlet.com',topic,'Find flashcards');
 const myp= /timed|mock|investigation|source challenge/.test(t)?linkHTML('ib-prep'):'';
 return specific+bbc+quiz+myp;
}
function slotHTML(s){const links=s.links.map(linkHTML).join('')+extraLinks(s);return `<article class="slot ${esc(s.category)}"><div class="slot-time">${esc(s.time)}</div><div class="slot-title">${esc(s.title)}</div>${s.task?`<p class="slot-desc">${esc(s.task)}</p>`:''}${links?`<div class="slot-links">${links}</div>`:''}</article>`;}
function dayHTML(week,i){return `<section class="day"><div class="day-head"><h3>${DAYS[i]}</h3><small>${fmtDay(week.start,i)}</small></div><div class="slot-list">${week.days[i].map(slotHTML).join('')}</div></section>`;}
function render(){const w=WEEKS[currentWeek];document.getElementById('week-tabs').innerHTML=WEEKS.map((wk,i)=>`<button class="tab ${i===currentWeek?'active':''}" type="button" onclick="chooseWeek(${i})">W${i+1} · ${fmtDay(wk.start,0)}–${fmtDay(wk.end,0)}</button>`).join('');document.getElementById('week-intro').innerHTML=`<div><div class="eyebrow">${esc(w.badge)}</div><h2>${esc(w.title)}</h2><p>${esc(w.subtitle)}</p></div><span class="pill">${fmtDay(w.start,0)}–${fmtDay(w.end,0)} 2026</span>`;document.getElementById('notice').textContent=currentWeek===0?'Wednesday 4 Nov: Maths with Nana starts at 5:30pm. Finishing at 6:30pm is provisional. Guitar is moved to Tuesday to avoid a clash.':'Mock dates are not confirmed. Check school homework and topic coverage in Google Classroom.';const main=document.getElementById('planner');if(view==='today'){const now=new Date();const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const i=Math.round((new Date(today+'T12:00:00')-new Date(w.start+'T12:00:00'))/86400000);main.className='today-wrap';main.innerHTML=i>=0&&i<7?dayHTML(w,i):'<div class="empty">Today isn’t in this selected week. Choose the matching week or use Full week.</div>';}else{main.className='days';main.innerHTML=w.days.map((_,i)=>dayHTML(w,i)).join('');}document.getElementById('btn-week').classList.toggle('active',view==='week');document.getElementById('btn-today').classList.toggle('active',view==='today');}
function chooseWeek(i){currentWeek=i;render();}function setView(v){view=v;render();}
(function init(){const today=new Date();const ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');const ix=WEEKS.findIndex(w=>ds>=w.start&&ds<=w.end);if(ix>=0)currentWeek=ix;render();})();
</script>
